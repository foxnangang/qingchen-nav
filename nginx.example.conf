# 卿辰导航 — Nginx 配置示例
#
# 用法：
#   1. 把 server_name / root / ssl 证书路径换成你自己的
#   2. fastcgi_pass 换成你本机的 PHP-FPM socket（见 `ls /tmp/php-cgi*.sock`）
#   3. nginx -t && nginx -s reload
#
# ⚠️ 三条 location 是安全关键，别删：
#      /data/            数据目录（含数据库）
#      lib.php seed.php  内部文件，只能被 require
#      隐藏文件          含 .git/.env 之类

server {
    listen 80;
    server_name nav.example.com;

    # 申请 Let's Encrypt 证书时保留这一条
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/nav.example.com;
        allow all;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nav.example.com;

    root  /www/wwwroot/nav.example.com;
    index index.php;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    charset utf-8;
    client_max_body_size 4m;

    # ---------- 安全 ----------

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/nav.example.com;
        allow all;
    }

    # 数据库与图标缓存，绝不能对外
    location ^~ /data/ {
        return 404;
    }

    # 内部库文件
    location ~ ^/(lib|seed)\.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    # 装完可以打开这一条，把安装页彻底封掉
    # location = /install.php { return 404; }

    # ---------- 静态资源 ----------

    # 用协商缓存：文件没变走 304（约 150 字节），变了立刻生效
    location ~* \.(css|js|svg|woff2?)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---------- 动态 ----------

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass  unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 30s;
    }
}
