# 卿辰导航 — Apache 补充配置
#
# 由 Dockerfile 复制到 /etc/apache2/conf-available/qcnav.conf 并启用。
# conf-available 里的配置在 apache2.conf 之后加载，所以能覆盖默认的
# `AllowOverride None`。

<Directory /var/www/html>
    # 关掉目录列表：避免 data/fav 之类被列举
    Options -Indexes +FollowSymLinks

    # ⚠️ 必须 All，否则 data/.htaccess 的「拒绝访问」不生效，
    #    data/nav.db 会变成可下载文件
    AllowOverride All

    Require all granted
</Directory>

# 静态资源走协商缓存（靠 ETag），改了立刻生效
<IfModule mod_headers.c>
    <FilesMatch "\.(css|js|svg)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
</IfModule>
