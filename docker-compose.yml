# 卿辰导航 — Docker Compose
#
# 用法：
#   1. docker compose up -d        （默认密码 foxnan888，装好请务必改掉）
#   2. 打开 http://服务器IP:18090
#   3. 用 admin / foxnan888 登录，进「设置 → 修改密码」换成你自己的
#
# 为什么默认用 18090：玩 NAS 的人 8090 大多已经被别的服务占了。
#
# ⚠️ 关于 QC_ADMIN_PASS（管理员密码），四条规则：
#   1. 至少 8 位。默认给的是 foxnan888 —— 只是让你贴完就能跑，请务必改掉
#   2. 只在「第一次启动 + 还没有数据库」时生效，用它创建 admin 账号
#   3. 已经装好之后再改这里没用！改密码请登录后台「设置 → 修改密码」
#   4. 填了不足 8 位的密码，自动安装会被跳过，你会看到安装页而不是导航页
#
# 关于端口 "18090:80"：
#   左边 18090 → 宿主机对外的端口，随便改（8090、9000、28080 都行）
#   右边 80    → 容器里 Apache 的端口，必须留 80
#               写成 "18090:18090" 是错的，容器里没人监听 18090，会打不开
#
# 想从源码自己构建，把 image 换成：
#   build: .
#   image: qcnav:local

services:
  qcnav:
    image: ghcr.io/foxnangang/qingchen-nav:latest
    container_name: qcnav
    ports:
      - "18090:80"
    environment:
      TZ: Asia/Shanghai
      QC_TITLE: 卿辰导航
      QC_ADMIN_USER: admin
      # ⚠️ 至少 8 位，必须改。默认值只为了开箱能跑
      QC_ADMIN_PASS: "foxnan888"
    volumes:
      # 数据目录。本地磁盘没问题（启动时会自动修正属主）；
      # 如果这里指向 SMB/NFS 网络挂载，改见 README「数据持久化」一节的 named volume 写法
      - ./data:/var/www/html/data
    restart: unless-stopped
