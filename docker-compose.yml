# 卿辰导航 — Docker Compose
#
# 用法：
#   1. 把 QC_ADMIN_PASS 改成你自己的密码（≥8 位）
#   2. docker compose up -d
#   3. 打开 http://服务器IP:8090
#
# 关于端口 "8090:80"：
#   左边 8090 → 宿主机对外的端口，随便改（18090、9000 都行）
#   右边 80   → 容器里 Apache 的端口，必须留 80
#              改成 "18090:18090" 是错的，容器里没人监听 18090，会访问不到
#
# 想从源码自己构建，把 image 换成：
#   build: .
#   image: qcnav:local

services:
  qcnav:
    image: ghcr.io/foxnangang/qingchen-nav:1.1.0
    container_name: qcnav
    ports:
      - "8090:80"
    environment:
      TZ: Asia/Shanghai
      QC_TITLE: 卿辰导航
      QC_ADMIN_USER: admin
      # 设了就在启动时自动装好；留空则打开网页用 install.php 手动装
      QC_ADMIN_PASS: "change-this-password"
    volumes:
      # 数据目录。本地磁盘没问题（启动时会自动修正属主）；
      # 如果这里指向 SMB/NFS 网络挂载，改见 README「数据持久化」一节的 named volume 写法
      - ./data:/var/www/html/data
    restart: unless-stopped
